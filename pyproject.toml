[project]
name = "predictive-back"
version = "0.1.0"
description = "Predictive maintenance ERP — backend"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.1,<6.0",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "drf-spectacular>=0.27",
    "django-filter>=24.3",
    "django-cors-headers>=4.4",
    "psycopg[binary]>=3.2",
    "celery>=5.4",
    "redis>=5.0",
    "django-celery-beat>=2.7",
    "boto3>=1.35",
    "django-storages>=1.14",
    "pillow>=11.0",
    "pillow-heif>=0.18",
    "pillow-avif-plugin>=1.4",
    "pyarrow>=17.0",
    "numpy>=2.1",
    "python-dotenv>=1.0",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "weasyprint>=62",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3", "pytest-django>=4.9", "pytest-cov>=5.0",
    "ruff>=0.7", "mypy>=1.13", "django-stubs>=5.1",
    "import-linter>=2.1", "factory-boy>=3.3", "freezegun>=1.5",
]

[tool.ruff]
line-length = 110
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "DJ", "RUF"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
[[tool.mypy.overrides]]
module = "modules.*.domain.*"
disallow_untyped_defs = true
strict = true

# Hexagonal boundaries are enforced here, not by convention.
[tool.importlinter]
root_packages = ["modules"]

[[tool.importlinter.contracts]]
name = "domain is pure python"
type = "forbidden"
source_modules = ["modules.*.domain"]
forbidden_modules = ["django", "rest_framework", "celery", "boto3"]

[[tool.importlinter.contracts]]
name = "layers point inwards"
type = "layers"
layers = ["interfaces", "infrastructure", "application", "domain"]
containers = [
    "modules.core", "modules.security", "modules.assets", "modules.thresholds",
    "modules.measurements", "modules.services", "modules.media", "modules.blueprints",
    "modules.nameplate", "modules.operating_data", "modules.vibration",
    "modules.ultrasound", "modules.thermography", "modules.diagnostics", "modules.reports",
]
